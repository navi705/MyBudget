name: my_budget_client
description: "My Budget - app to track expenses and incomes"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.29.0
  flutter_localizations:
    sdk: flutter
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.5
  get_it: ^7.7.0
  http: any

  path: any
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  bloc: ^9.1.0
  rxdart: ^0.28.0
  go_router: ^17.0.0
  flutter_dotenv: ^6.0.0
  collection: ^1.19.1
  intl: ^0.20.2
  fl_chart: ^1.1.1
  uuid: ^4.5.2
  google_fonts: ^6.2.1
  device_info_plus: ^12.3.0
  stream_transform: ^2.1.1
  bloc_concurrency: ^0.3.0
  scrollable_positioned_list: ^0.3.8
  super_sliver_list: ^0.4.1
  material_symbols_icons: ^4.2892.0
  flex_color_picker: ^3.7.2
  flutter_acrylic: ^1.1.4

  image: ^4.1.7
  flutter_svg: ^2.0.10
  file_picker: ^10.3.8
  csv: ^6.0.0
  flutter_date_pickers: ^0.4.3
  share_plus: ^10.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.4.11
  mockito: ^5.4.4
  bloc_test: ^10.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - lib/icons/
    - lib/data/currency_history.json
    - assets/backgrounds/


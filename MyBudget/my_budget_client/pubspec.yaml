name: my_budget_client
description: "My Budget - app to track expenses and incomes"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.17.0
  flutter_localizations:
    sdk: flutter
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  get_it: ^7.7.0

  path: any
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  bloc: ^9.1.0
  rxdart: ^0.28.0
  go_router: ^17.0.0
  flutter_dotenv: ^6.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.17.0
  build_runner: ^2.4.11
  mockito: ^5.4.4
  bloc_test: ^10.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env

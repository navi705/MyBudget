flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon_v2.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon_v2.png"
    background_color: "#1E1E2E"
    theme_color: "#3B82F6"
  windows:
    generate: true
    image_path: "assets/icon/app_icon_v2.png"
    icon_size: 48    # Optional
  macos:
    generate: true
    image_path: "assets/icon/app_icon_v2.png"

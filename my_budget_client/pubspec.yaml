name: my_budget_client
description: "My Budget - app to track expenses and incomes"
publish_to: 'none'
version: 0.1.2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  flutter_localizations:
    sdk: flutter
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.5
  get_it: ^7.7.0
  http: any
  web_socket_channel: ^3.0.0

  path: any
  archive: ^3.6.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  bloc: ^9.1.0
  rxdart: ^0.28.0
  go_router: ^17.0.0
  flutter_dotenv: ^6.0.0
  collection: ^1.19.1
  intl: ^0.20.2
  fl_chart: ^1.1.1
  uuid: ^4.5.2
  google_fonts: ^6.2.1
  device_info_plus: ^12.3.0
  stream_transform: ^2.1.1
  bloc_concurrency: ^0.3.0
  scrollable_positioned_list: ^0.3.8
  super_sliver_list: ^0.4.1
  material_symbols_icons: ^4.2892.0
  flex_color_picker: ^3.7.2
  flutter_acrylic: ^1.1.4

  image: ^4.1.7
  flutter_svg: ^2.0.10
  file_picker: ^10.3.8
  csv: ^6.0.0
  flutter_date_pickers: ^0.4.3
  share_plus: ^10.0.0
  json_annotation: ^4.9.0
  flutter_sms_reader: ^0.0.1  # Requires Dart 3.9.2+, stub used instead
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.5
  flutter_driver:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.4.11
  mockito: ^5.4.4
  bloc_test: ^10.0.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.2
  sqlite3: ^2.9.4
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
  msix: ^3.16.9

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F5F5F0" # Approximate off-white from the image
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:

    - lib/icons/
    - lib/data/currency_history.bin
    - assets/icon/
    - assets/backgrounds/

